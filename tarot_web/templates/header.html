<header class="app-header">
  <a class="app-header-brand" href="/">TAROT IMB</a>

  <nav class="app-header-nav" aria-label="Navigation principale">
    <a href="/#ranking-heading">Classement</a>
    <a href="/history">Historique</a>
    <a href="/graphs">Graphiques</a>
  </nav>

  {% if not hide_game_action | default(false) %}<a class="app-header-action" href="/game">Saisir une partie</a>{% endif %}

  <details class="app-header-account">
    <summary>Compte</summary>
    <div class="app-header-account-panel">
      {% if user is defined and user and user.name is defined and user.name %}
      <p class="app-header-user">{{ user.name }}</p>
      {% endif %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf | default('', true) }}">
        <button type="submit">Déconnexion</button>
      </form>
    </div>
  </details>
</header>
